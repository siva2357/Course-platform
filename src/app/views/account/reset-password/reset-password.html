<div class="reset-layout d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="reset-card shadow-sm">
    <div class="text-center mb-4">
      <img src="/logo 2.png" alt="Course Hub" class="logo mb-3" />
      <div class="icon-circle mx-auto mb-3">
        <i class="bi bi-shield-lock-fill"></i>
      </div>
      <h1 class="h4 fw-bold text-dark mb-2">Set a New Password</h1>
      <p class="text-muted small mb-0">
        Create a strong new password for your Course Hub account.
      </p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="resetPassword()" novalidate>
      <div class="mb-3">
        <app-input-field
          label="New Password"
          type="password"
          placeholder="Enter new password"
          icon="bi bi-lock"
          [showIcon]="true"
          [showPasswordToggle]="true"
          [value]="resetForm.get('newPassword')?.value || ''"
          (valueChange)="resetForm.get('newPassword')?.setValue($event); resetForm.get('newPassword')?.markAsDirty()"
          (blurred)="resetForm.get('newPassword')?.markAsTouched()"
          [validation]="getValidationState('newPassword')"
          [errorMessage]="getErrorMessage('newPassword')">
        </app-input-field>
      </div>

      <div class="mb-4">
        <app-input-field
          label="Confirm New Password"
          type="password"
          placeholder="Re-enter new password"
          icon="bi bi-lock-fill"
          [showIcon]="true"
          [showPasswordToggle]="true"
          [value]="resetForm.get('confirmPassword')?.value || ''"
          (valueChange)="resetForm.get('confirmPassword')?.setValue($event); resetForm.get('confirmPassword')?.markAsDirty()"
          (blurred)="resetForm.get('confirmPassword')?.markAsTouched()"
          [validation]="getValidationState('confirmPassword')"
          [errorMessage]="getErrorMessage('confirmPassword')">
        </app-input-field>
      </div>

      <app-button
        type="submit"
        label="Update Password"
        variant="primary"
        [block]="true"
        class="w-100 d-block">
        <i class="bi bi-check2-circle me-1"></i>
      </app-button>
    </form>

    <div class="text-center mt-4 pt-3 border-top">
      <a routerLink="/login" class="text-primary small fw-semibold text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i>Back to Log In
      </a>
    </div>
  </div>
</div>
