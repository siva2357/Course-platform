<div class="forgot-layout d-flex align-items-center justify-content-center min-vh-100 p-3">
  <div class="forgot-card shadow-sm">
    <div class="text-center mb-4">
      <img src="/logo 2.png" alt="Course Hub" class="logo mb-3" />
      <div class="icon-circle mx-auto mb-3">
        <i class="bi bi-key-fill"></i>
      </div>
      <h1 class="h4 fw-bold text-dark mb-2">Forgot Your Password?</h1>
      <p class="text-muted small mb-0">
        Enter the email address associated with your Course Hub account and we'll send a password reset link.
      </p>
    </div>

    @if (submittedSuccess) {
      <div class="alert alert-primary small text-center mb-4">
        <i class="bi bi-envelope-check-fill me-1"></i>
        Password reset instructions have been sent to <strong>{{ forgotForm.value.email }}</strong>.
      </div>
      <div class="d-grid gap-2">
        <a routerLink="/reset-password" class="btn btn-primary btn-sm py-2 fw-semibold">
          Proceed to Reset Password Demo
        </a>
        <a routerLink="/login" class="btn btn-outline-primary btn-sm py-2 fw-semibold">
          Back to Log In
        </a>
      </div>
    } @else {
      <form [formGroup]="forgotForm" (ngSubmit)="sendResetLink()" novalidate>
        <div class="mb-4">
          <app-input-field
            label="Email Address"
            type="email"
            placeholder="Enter your registered email"
            icon="bi bi-envelope"
            [showIcon]="true"
            [value]="forgotForm.get('email')?.value || ''"
            (valueChange)="forgotForm.get('email')?.setValue($event); forgotForm.get('email')?.markAsDirty()"
            (blurred)="forgotForm.get('email')?.markAsTouched()"
            [validation]="getValidationState()"
            [errorMessage]="getErrorMessage()">
          </app-input-field>
        </div>

        <app-button
          type="submit"
          label="Send Reset Link"
          variant="primary"
          [block]="true"
          class="w-100 d-block">
          <i class="bi bi-send-fill me-1"></i>
        </app-button>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <a routerLink="/login" class="text-primary small fw-semibold text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i>Back to Log In
        </a>
      </div>
    }
  </div>
</div>
